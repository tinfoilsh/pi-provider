# Does the provider still install and load in pi?
#
# ci.yml typechecks, which resolves imports against node_modules where they all
# exist. pi maps an extension's `@earendil-works/*` imports to its own copies,
# and only for some paths, so an import that typechecks can still fail to load.
# pi then prints an error and starts without the Tinfoil models. A pi release
# can cause that without this repo changing, and pi releases about once a
# week, hence the schedule.
name: Install test

on:
  schedule:
    - cron: "0 13 * * *"
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}
concurrency:
  group: install-${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request run is fine; cancelling the scheduled run would
  # throw away the one whose failure opens an issue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What we are about to ship, against the newest pi and the oldest it loads in.
  tree:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.81.0 is the oldest pi the provider loads in; 0.80 offers no Tinfoil
        # models. Keeping it here means a fix for the newest pi cannot quietly
        # drop support for older ones.
        pi: [latest, 0.81.0]
    name: tree (pi ${{ matrix.pi }})
    timeout-minutes: 15
    env:
      # pi only offers the models when a key is set. Deliberately not a real
      # one: loading the provider verifies the enclave and reads the public
      # model list, neither of which sends the key, and nothing in this
      # workflow should be able to spend money with real credentials.
      TINFOIL_API_KEY: tk_not_a_real_key_models_only
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Through env rather than inline interpolation, so the version can never
      # be expanded into the shell command itself.
      - name: Install pi (${{ matrix.pi }})
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          npm install --prefix "$RUNNER_TEMP/pi" --no-fund --no-audit "@earendil-works/pi-coding-agent@$PI_VERSION"
          echo "$RUNNER_TEMP/pi/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Report the pi version
        run: echo "pi $(pi --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      # pi does not install a local package's dependencies, so install them
      # first, as `pi install npm:...` would.
      #
      # --omit=peer: `pi install npm:...` leaves out peer dependencies, which are
      # pi's own packages. With them in node_modules, an import pi cannot map
      # would quietly load from there and this test would pass when users break.
      #
      # --ignore-scripts: nothing here needs install scripts; pi wants sources.
      - name: Install dependencies
        run: npm ci --omit=peer --ignore-scripts

      # A directory argument links rather than installing from the registry,
      # which is the only way to test unreleased code. It reaches the same
      # loader: a broken import fails here exactly as it does after an install.
      - name: Install the working tree as a package
        run: pi install "$GITHUB_WORKSPACE"

      # This is the assertion, not the step above. Installing reports success
      # even when the extension cannot load; only listing its models shows that.
      # Run outside the checkout so pi reads no project settings from it.
      - name: The provider loads and lists models
        working-directory: ${{ runner.temp }}
        run: |
          out=$(pi --list-models tinfoil 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^tinfoil '

  # What users actually have. Between a fix landing on main and a release, this
  # is the only leg that still reports the break they are hitting.
  published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: published (pi latest)
    timeout-minutes: 15
    env:
      # pi only offers the models when a key is set. Deliberately not a real
      # one: loading the provider verifies the enclave and reads the public
      # model list, neither of which sends the key, and nothing in this
      # workflow should be able to spend money with real credentials.
      TINFOIL_API_KEY: tk_not_a_real_key_models_only
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pi (latest)
        run: |
          npm install --prefix "$RUNNER_TEMP/pi" --no-fund --no-audit "@earendil-works/pi-coding-agent@latest"
          echo "$RUNNER_TEMP/pi/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Report the pi version
        run: echo "pi $(pi --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the published provider
        run: pi install npm:@tinfoilsh/pi-provider

      - name: The provider loads and lists models
        working-directory: ${{ runner.temp }}
        run: |
          out=$(pi --list-models tinfoil 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^tinfoil '

  # A scheduled failure has to reach a person. A new issue emails repo watchers;
  # a continuing failure comments rather than opening another one.
  report:
    name: report a scheduled failure
    needs:
      - tree
      - published
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.tree.result == 'failure' || needs.published.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # open or comment on the issue announcing the break
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TREE: ${{ needs.tree.result }}
          PUBLISHED: ${{ needs.published.result }}
        run: |
          title="Install test failing: the provider does not load in pi"
          body=$(printf '%s\n' \
            "The scheduled install test failed, which usually means pi shipped a release that changed how it loads an extension's imports." \
            "" \
            "- working tree: \`$TREE\`" \
            "- published package: \`$PUBLISHED\`" \
            "- run: $RUN_URL" \
            "" \
            "If only the published leg failed, a fix is on main but not released yet.")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
